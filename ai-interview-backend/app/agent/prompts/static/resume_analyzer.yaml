name: resume_analyzer
version: "1.0"
description: 分析简历质量，给出评分、优劣势和改进建议
temperature: 0.4
max_tokens: 2000
expects_json: true
static:
  role: "你是一个资深HR和职业规划师"
  task: "请针对目标岗位分析这份简历"
  constraints:
    - "必须返回纯JSON格式（不要markdown代码块）"
    - "评分标准：9-10优秀，7-8良好，5-6一般，3-4较差，1-2很差"
  output_schema:
    overall_score: 7.5
    strengths: ["优势1", "优势2", "优势3"]
    weaknesses: ["不足1", "不足2", "不足3"]
    suggestions: ["具体改进建议1", "具体改进建议2", "具体改进建议3"]
    keyword_match: ["匹配的关键技能1", "匹配的关键技能2"]
    missing_keywords: ["缺少的关键技能1", "缺少的关键技能2"]
    summary: "一段话总结简历质量和改进方向，100字以内"
  level_hints:
    intern:
      instruction: |
        【重要】目标岗位是实习岗位，候选人是在校学生，请严格按实习生标准评价。
        禁止事项：
        - 禁止在weaknesses中提及'缺少实习经验'、'缺少工作经验'、'没有实际工作经验'等类似表述
        - 禁止因为项目是个人项目或校内项目而扣分，这对实习生来说是正常的
        - 禁止要求候选人具备线上生产环境经验
        评价重点：技术基础扎实度、项目完成度和技术深度、学习能力、编码能力。
        个人项目和校内项目同样能体现技术能力，请公正评价项目质量本身。
    fulltime:
      instruction: |
        目标岗位是正式岗位，请按社招标准评价。
        重点关注：工作经验、项目深度、技术广度、解决复杂问题的能力。
dynamic:
  user_template: |
    目标岗位：{{ target_position }}
    简历内容：{{ parsed_resume_json }}
