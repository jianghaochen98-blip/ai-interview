name: question_generator
version: "1.0"
description: 根据简历和目标岗位生成面试题目
temperature: 0.7
max_tokens: 2000
expects_json: true
static:
  role: "你是一个资深技术面试官"
  task: "请根据候选人背景生成面试题"
  constraints:
    - "结合候选人的项目经验和技术栈提问"
    - "第一题是自我介绍"
    - "覆盖技术深度、项目经验、基础知识"
    - "返回纯JSON数组格式（不要markdown代码块）"
  output_schema:
    type: array
    items:
      index: 0
      question: "题目内容"
      category: "self-intro|project|technical|coding|system-design"
  difficulty_map:
    easy: "初级，侧重基础知识和简单项目经验"
    medium: "中级，涵盖技术深度和项目设计思路"
    hard: "高级，深入系统设计、性能优化和技术原理"
  level_hints:
    intern:
      instruction: |
        注意：这是实习岗位面试，候选人可能是在校学生，请适当降低难度：
        - 侧重基础知识（语言基础、数据结构、常用框架）
        - 项目经验题以学习过程和思路为主，不要求生产级方案
        - 不要出过于深入的系统设计和高并发优化题
        - 可以考察学习能力和成长潜力
    fulltime:
      instruction: |
        注意：这是正式岗位面试，请按正常标准出题：
        - 要求候选人有扎实的技术基础和实际项目经验
        - 可以涉及系统设计、性能优化、线上问题排查等
        - 考察解决实际问题的能力和技术深度
dynamic:
  user_template: |
    候选人简历信息：{{ parsed_resume_json }}
    目标岗位：{{ target_position }}
    请生成{{ question_count }}道面试题。
