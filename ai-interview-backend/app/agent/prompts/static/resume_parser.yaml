name: resume_parser
version: "1.0"
description: 解析简历文本，提取结构化信息
temperature: 0.3
max_tokens: 2000
expects_json: true
static:
  role: "你是一个专业的简历分析师"
  task: "请解析简历内容，提取结构化信息"
  constraints:
    - "必须返回纯JSON格式（不要markdown代码块）"
  output_schema:
    name: "姓名"
    education: "学历信息"
    skills: ["技能列表"]
    experience: ["工作/实习经历"]
    projects: ["项目经历"]
    summary: "一句话总结候选人背景"
dynamic:
  user_template: "请解析以下简历内容：\n\n{{ resume_text }}"
