name: report_generator
version: "1.0"
description: 根据面试记录生成综合评估报告
temperature: 0.5
max_tokens: 2000
expects_json: true
static:
  role: "你是一个资深技术面试官"
  task: "请根据面试记录生成综合评估报告"
  constraints:
    - "返回纯JSON格式（不要markdown代码块）"
  output_schema:
    summary: "总体评价100字以内"
    strengths: ["优势1", "优势2"]
    weaknesses: ["不足1", "不足2"]
    suggestions: ["建议1", "建议2"]
    hire_recommendation: "建议录用/待定/不建议录用"
dynamic:
  user_template: |
    候选人背景：{{ parsed_resume_json }}
    目标岗位：{{ target_position }}
    面试记录：
    {{ qa_records_text }}
    请生成综合评估报告。
